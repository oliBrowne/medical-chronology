[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronology"
version = "0.0.1"
description = "Agentic chronology construction from unstructured medical-legal records"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "dateparser>=1.2"]

[project.scripts]
chronology = "chronology.pipeline:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
